name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: composer check (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Run the same tools as `composer check`, but with Pint in --test mode so
      # style problems fail CI instead of being auto-fixed.
      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (Pest)
        run: composer test

      - name: Architecture (Deptrac)
        run: composer deptrac
