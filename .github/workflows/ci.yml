name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: composer check (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # The Laravel integration (src/Laravel/) is dev-only: illuminate/* lives in
        # require-dev + suggest, never in require. This dimension is what backs the
        # "Laravel 11, 12 and 13" claim in the README — without it, consumers on 12
        # or 13 would be running untested code. All three majors work on PHP 8.3+
        # (illuminate 11/12 need ^8.2, 13 needs ^8.3), so no excludes are needed.
        laravel: ['11', '12', '13']

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # composer update (not install): the constraint allows three majors, so the
      # matrix has to pin one explicitly. -W lets the illuminate/* sub-packages
      # (collections, filesystem, view, ...) move to the matching major too.
      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          composer update -W --no-interaction --prefer-dist --no-progress \
            --with="illuminate/config:^${{ matrix.laravel }}.0" \
            --with="illuminate/console:^${{ matrix.laravel }}.0" \
            --with="illuminate/container:^${{ matrix.laravel }}.0" \
            --with="illuminate/queue:^${{ matrix.laravel }}.0" \
            --with="illuminate/support:^${{ matrix.laravel }}.0"

      # Run the same tools as `composer check`, but with Pint in --test mode so
      # style problems fail CI instead of being auto-fixed.
      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: composer analyse

      - name: Tests (Pest)
        run: composer test

      - name: Architecture (Deptrac)
        run: composer deptrac

  # The signing service and everything hardened around it — assertion limits
  # (SPEC-011), audit logging (SPEC-012), trust verification (SPEC-014) and rate
  # limiting (SPEC-015) — live in the `integration` group, which `composer check`
  # excludes because it needs a running service. Until this job existed those
  # tests only ran when somebody remembered to run them by hand, which is not a
  # guarantee: every service-side protection was defended by a suite CI never
  # executed.
  #
  # Several criteria describe service configurations that cannot coexist in one
  # process (trust on vs off, the AI-marking policy on vs off, a rate limit low
  # enough to exercise). Each profile below starts the service differently; the
  # tests gate on what GET /health reports and skip what does not apply, so the
  # union of the profiles covers the set.
  integration:
    name: integration (${{ matrix.profile.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          # The rate limit is raised out of the way in the first two profiles,
          # not because the default is wrong but because the suite is denser
          # than any real client: ~50 signing requests in under a minute,
          # including SPEC-015's own deliberate bursts. Left at 60/min the
          # suite trips its own limit and every other group fails with 429.
          # The concurrency cap stays at its default, which is what SPEC-015
          # AC3 exercises.
          #
          # READ_RATE_LIMIT_REQUESTS gets the same treatment (SPEC-024): every
          # signing test reads its asset back, so a sign+read round-trip spends
          # from both budgets and the suite is denser in reads than in signs.
          - name: defaults
            env: |
              RATE_LIMIT_REQUESTS=1000
              READ_RATE_LIMIT_REQUESTS=1000
            groups: integration
          - name: hardened
            env: |
              RATE_LIMIT_REQUESTS=1000
              READ_RATE_LIMIT_REQUESTS=1000
              CONTENTAUTH_TRUST_SETTINGS=/run/secrets/c2pa-trust.settings.json
              REQUIRE_AI_MARKING=true
            groups: integration
          # A low rate limit would make every other group collide with it, so
          # this profile runs SPEC-015 alone.
          - name: rate-limited
            env: |
              RATE_LIMIT_REQUESTS=5
              RATE_LIMIT_WINDOW_MS=2000
            groups: SPEC-015
          # SPEC-024's read budget, small, while the SIGN budget stays large --
          # which is the point. AC3 asserts that exhausting one does not spend
          # the other, and it can only tell them apart when the two numbers are
          # far enough apart that coincidence is ruled out. The `defaults`
          # profile covers the read concurrency cap, which needs the opposite:
          # a rate budget high enough not to answer 429 first.
          - name: read-limited
            env: |
              RATE_LIMIT_REQUESTS=1000
              READ_RATE_LIMIT_REQUESTS=5
              RATE_LIMIT_WINDOW_MS=2000
            groups: SPEC-024
          # SPEC-030's failed-authentication budget, small enough to exhaust
          # inside a test, with a short window so one turns over while AC8 counts
          # audit records. The `defaults` profile covers the opposite half: AC2
          # and AC3 need a budget generous enough that a few bad-token requests
          # are answered 401/413 rather than 429. Same split as read-limited.
          - name: auth-limited
            env: |
              RATE_LIMIT_REQUESTS=1000
              READ_RATE_LIMIT_REQUESTS=1000
              AUTH_FAIL_LIMIT=5
              RATE_LIMIT_WINDOW_MS=2000
            groups: SPEC-030
          # SPEC-019's equivalence check needs BOTH readers, so this is the only
          # profile that installs ext-c2pa. Deliberately not added to the others:
          # AC5 is about the extension being ABSENT, and installing it everywhere
          # would delete the only place that criterion is exercised.
          #
          # Trust settings are ON here, and that is deliberate. AC2 compares two
          # engines, so it only compares them properly when both are configured
          # the same way — and the combination "extension installed + service
          # verifying trust" existed on developer machines and in no CI profile,
          # which is why a configuration difference could be reported as an
          # engine divergence for two days without CI noticing.
          - name: ext-c2pa
            env: |
              RATE_LIMIT_REQUESTS=1000
              READ_RATE_LIMIT_REQUESTS=1000
              CONTENTAUTH_TRUST_SETTINGS=/run/secrets/c2pa-trust.settings.json
            groups: SPEC-019
            ext: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update -W --no-interaction --prefer-dist --no-progress

      # The private test key is deliberately not committed (see README); fetch
      # the c2pa-rs sample. Test material only — never a real key.
      - name: Fetch the ES256 test signing key
        run: |
          curl -sfSL https://raw.githubusercontent.com/contentauth/c2pa-rs/main/cli/sample/es256_private.key \
            -o certs/es256_private.key

      - name: Configure the service (${{ matrix.profile.name }})
        run: |
          {
            echo "CONTENTAUTH_API_KEY=$(openssl rand -hex 32)"
            echo "${{ matrix.profile.env }}"
          } > .env

      - name: Start the signing service
        run: |
          docker compose up -d --build
          for i in $(seq 30); do
            curl -sf http://127.0.0.1:3000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/health

      # SPEC-019. The install is verified rather than assumed: PIE reports
      # success on paths that do not end with a loaded extension, and a profile
      # whose extension quietly failed to load would SKIP every criterion it
      # exists to run and report green.
      # Pinned, and the pin is verified. This profile runs SPEC-019's equivalence
      # check, which is the alarm for the two engines drifting apart — c2pa-rs
      # 0.89.0 in the extension against 0.90.4 in the service. An alarm whose
      # input version can change without anyone deciding is not an alarm: an
      # upstream release would either turn it red for a reason we did not cause,
      # or green against an engine we did not think we were testing.
      #
      # Bump deliberately. Dependabot does not see this — it is a CI step, not a
      # Composer dependency — so the version below is the only record of what the
      # equivalence claim was ever measured against.
      - name: Install ext-c2pa (PIE)
        if: matrix.profile.ext
        env:
          EXT_C2PA_VERSION: '0.1.0'
        run: |
          curl -sfSL https://github.com/php/pie/releases/latest/download/pie.phar -o /tmp/pie.phar
          sudo php /tmp/pie.phar install "ericmann/ext-c2pa:${EXT_C2PA_VERSION}" --auto-install-build-tools
          php -r 'exit(extension_loaded("c2pa") ? 0 : 1);' \
            || { echo "::error::ext-c2pa installed but not loaded"; php -m; exit 1; }
          # The pin is not evidence until it is checked. PIE reports success on
          # paths that do not end in the version asked for, which is the same
          # shape as the install that reports success without loading anything.
          LOADED=$(php -r 'echo phpversion("c2pa");')
          [ "$LOADED" = "$EXT_C2PA_VERSION" ] \
            || { echo "::error::expected ext-c2pa $EXT_C2PA_VERSION, loaded $LOADED"; exit 1; }
          php --ri c2pa

      - name: Integration tests (${{ matrix.profile.groups }})
        run: |
          set -a && . ./.env && set +a
          vendor/bin/pest --group=${{ matrix.profile.groups }} | tee /tmp/pest.out
          exit "${PIPESTATUS[0]}"

      # A skipped equivalence check is not a passing one, and the difference is
      # invisible in an exit code. This profile exists for exactly one test, so
      # it asserts that that test actually ran.
      - name: Assert the equivalence check ran
        if: matrix.profile.ext
        run: |
          grep -q 'agrees with the signing-service reader on every public accessor' /tmp/pest.out \
            || { echo "::error::SPEC-019 AC2 did not run — the two readers were never compared"; exit 1; }
          grep -q '✓.*agrees with the signing-service reader' /tmp/pest.out \
            || { echo "::error::SPEC-019 AC2 was skipped rather than passed"; sed -n '1,80p' /tmp/pest.out; exit 1; }

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200 service

      - name: Stop the signing service
        if: always()
        run: docker compose down

  # A single stable check to require in branch protection.
  #
  # Requiring the real jobs by name does not work well here: they are matrix
  # jobs, so the names carry their parameters — "composer check (PHP 8.3,
  # Laravel 11)" and eleven more. A required-checks list built from those goes
  # stale the moment the matrix changes, and it fails in the dangerous
  # direction: add Laravel 14 and its job is simply not required, so a red run
  # merges. This job depends on all of them and is the only name protection
  # needs to know.
  #
  # `if: always()` is load-bearing. Without it the job is skipped when anything
  # upstream fails, and a skipped required check does not block a merge — the
  # protection would silently permit exactly what it exists to stop.
  all-green:
    name: all checks passed
    needs: [check, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo "check:       ${{ needs.check.result }}"
          echo "integration: ${{ needs.integration.result }}"
          # Anything other than success — failure, cancelled, or skipped —
          # means this must not report green.
          [ "${{ needs.check.result }}" = "success" ] || exit 1
          [ "${{ needs.integration.result }}" = "success" ] || exit 1
