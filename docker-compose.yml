name: c2pa-spike

services:
  service:
    build:
      context: ./service
    ports:
      # Loopback only. "3000:3000" publishes on 0.0.0.0 (and ::), which exposes
      # the one process holding the signing key to every network that can reach
      # the host — over plain HTTP, so the bearer token crosses the wire in the
      # clear. Change this only together with TLS termination and a deliberate
      # network boundary; see the security note in the README.
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      CONTENTAUTH_API_KEY: "${CONTENTAUTH_API_KEY:?set CONTENTAUTH_API_KEY in .env}"
      CONTENTAUTH_SIGN_ALG: "es256"
      # Optional RFC 3161 timestamp authority (SPEC-007). Empty => no timestamp.
      CONTENTAUTH_TSA_URL: "${CONTENTAUTH_TSA_URL:-}"
      # Optional c2pa trust settings (SPEC-014). Empty => no trust-list
      # verification, so reads stop at "Valid" + signingCredential.untrusted.
      # The document below is mounted read-only; set this to its container path
      # to switch verification on:
      #   CONTENTAUTH_TRUST_SETTINGS=/run/secrets/c2pa-trust.settings.json
      CONTENTAUTH_TRUST_SETTINGS: "${CONTENTAUTH_TRUST_SETTINGS:-}"
      # Assertion limits (SPEC-011). Structural limits are restrictive by
      # default; leave them unless you have a reason. The semantic policy is the
      # opposite — off unless this certificate exists solely to mark AI content.
      REQUIRE_AI_MARKING: "${REQUIRE_AI_MARKING:-}"
      MAX_ASSERTIONS: "${MAX_ASSERTIONS:-16}"
      MAX_ASSERTION_BYTES: "${MAX_ASSERTION_BYTES:-65536}"
      MAX_ASSERTION_DEPTH: "${MAX_ASSERTION_DEPTH:-16}"
      MAX_CREATOR_NAME: "${MAX_CREATOR_NAME:-256}"
      # Rate limiting and concurrency bounds (SPEC-015). On by default; 0
      # disables a limit explicitly and /health reports that.
      MAX_CONCURRENT_SIGNS: "${MAX_CONCURRENT_SIGNS:-4}"
      RATE_LIMIT_REQUESTS: "${RATE_LIMIT_REQUESTS:-60}"
      # Read path, bounded separately (SPEC-024). Reading costs ~3-5x the asset
      # against signing's ~7x, so the concurrency cap matches rather than being
      # generous; the rate budget is higher because sustained rate is about fair
      # use while the cap is what bounds peak memory.
      MAX_CONCURRENT_READS: "${MAX_CONCURRENT_READS:-4}"
      READ_RATE_LIMIT_REQUESTS: "${READ_RATE_LIMIT_REQUESTS:-240}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-15000}"
      HEADERS_TIMEOUT_MS: "${HEADERS_TIMEOUT_MS:-10000}"
      # Optional: keeps audit token_id values stable across restarts (SPEC-012).
      # Unset => a per-process salt, which still correlates within one run.
      CONTENTAUTH_TOKEN_ID_SALT: "${CONTENTAUTH_TOKEN_ID_SALT:-}"
      SIGNING_CERT_PATH: "/run/secrets/signing.crt"
      SIGNING_KEY_PATH: "/run/secrets/signing.key"
    volumes:
      # TEST certs only — es256 sample cert/key from c2pa-rs. Never real keys.
      - ./certs/es256_certs.pem:/run/secrets/signing.crt:ro
      - ./certs/es256_private.key:/run/secrets/signing.key:ro
      # TEST trust anchors (public CA certs only — safe to mount, safe to
      # commit). Mounting it does nothing on its own; CONTENTAUTH_TRUST_SETTINGS
      # above decides whether it is used. Replace for production.
      - ./certs/c2pa-trust.settings.json:/run/secrets/c2pa-trust.settings.json:ro
    restart: unless-stopped